name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run artifact:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: source-map-resolve-release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14
