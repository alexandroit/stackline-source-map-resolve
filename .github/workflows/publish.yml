name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run for this exact source commit
        required: true
        type: string
      expected_sha512:
        description: SHA-512 hex digest of the reviewed release tarball
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI and CodeQL for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/reviewed-ci.json"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '.head_sha == $sha and .head_repository.full_name == $repo and .head_branch == "main" and .event == "push" and .path == ".github/workflows/ci.yml" and .conclusion == "success"' "$RUNNER_TEMP/reviewed-ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/reviewed-runs.json"
          jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | any(.head_sha == $sha and .path == ".github/workflows/codeql.yml" and .conclusion == "success")' "$RUNNER_TEMP/reviewed-runs.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Require default branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Pin the publishing npm CLI
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: node --test scripts/registry-requests.test.mjs
      - run: npm run verify
      - name: Reject an existing public version and unexpected registry errors
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { name, version } = require('./package.json');
          const result = spawnSync('npm', ['view', `${name}@${version}`, 'version', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
          if (result.status === 0) throw new Error(`${name}@${version} already exists`);
          let response;
          try { response = JSON.parse(result.stdout); } catch { throw new Error('Registry absence check did not return npm JSON'); }
          if (result.error || result.signal || response.error?.code !== 'E404') {
            process.stderr.write(result.stderr || 'Unexpected npm registry error');
            process.exit(1);
          }
          NODE
      - name: Download the tested CI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-package
          path: artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Build the reviewed immutable artifact
        shell: bash
        env:
          EXPECTED_SHA512: ${{ inputs.expected_sha512 }}
        run: |
          test "$(find artifact -name '*.tgz' | wc -l)" -eq 1
          tar -xOf artifact/*.tgz package/package.json > "$RUNNER_TEMP/reviewed-manifest.json"
          node -e "require('node:assert/strict').deepEqual(require(process.argv[1]), require('./package.json'))" "$RUNNER_TEMP/reviewed-manifest.json"
          expected="$(printf '%s' "$EXPECTED_SHA512" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [[ "$expected" =~ ^[0-9a-f]{128}$ ]]
          actual="$(sha512sum artifact/*.tgz | awk '{print $1}')"
          test "$actual" = "$expected"
          (cd artifact && sha512sum *.tgz > SHA512SUMS)
          npm sbom --omit=dev --sbom-format cyclonedx > artifact/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: artifact/
          if-no-files-found: error
      - name: Publish the exact artifact with OIDC and provenance
        run: npm publish ./artifact/*.tgz --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STACKLINE_NPM_PUBLISH_TOKEN }}
      - name: Verify registry bytes, consumers, signatures, and provenance
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_PUBLICATION_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: node scripts/verify-registry.mjs artifact/*.tgz
      - name: Assemble immutable release evidence
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node scripts/release-evidence.mjs artifact
      - name: Publish and verify the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.mjs artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-package-evidence
          path: artifact/*
          if-no-files-found: error
